<svg class="playoff-status-icon" [class]="status()" viewBox="0 0 24 24" role="img" [attr.aria-label]="label()">
  <title>{{ label() }}</title>
  @switch (status()) {
    @case ('hunt') {
      <path class="lock-shackle" d="M7 10V7a5 5 0 0 1 9-3.1" />
      <rect class="lock-body" x="5" y="10" width="14" height="10" rx="2" />
      <circle class="lock-hole" cx="12" cy="15" r="1.3" />
    }
    @case ('clinched-berth') {
      <path class="lock-shackle" d="M7 10V7a5 5 0 0 1 10 0v3" />
      <rect class="lock-body" x="5" y="10" width="14" height="10" rx="2" />
      <circle class="lock-hole" cx="12" cy="15" r="1.4" />
    }
    @case ('clinched-division') {
      <path class="lock-shackle" d="M7 10V7a5 5 0 0 1 8.4-3.6" />
      <rect class="lock-body" x="4" y="10" width="13" height="10" rx="2" />
      <circle class="lock-hole" cx="10.5" cy="15" r="1.4" />
      <circle class="badge-dot" cx="18.5" cy="7" r="4.6" />
      <text class="badge-chip" x="18.5" y="9.3" text-anchor="middle">★</text>
    }
    @case ('clinched-bye') {
      <path class="lock-shackle" d="M7 10V7a5 5 0 0 1 8.4-3.6" />
      <rect class="lock-body" x="4" y="10" width="13" height="10" rx="2" />
      <circle class="lock-hole" cx="10.5" cy="15" r="1.4" />
      <circle class="badge-dot" cx="18.5" cy="7" r="4.6" />
      <text class="badge-chip" x="18.5" y="9.3" text-anchor="middle">1</text>
    }
    @case ('eliminated') {
      <path class="lock-shackle" d="M7 10V7a5 5 0 0 1 10 0v3" />
      <rect class="lock-body" x="5" y="10" width="14" height="10" rx="2" />
      <line class="strike" x1="2.5" y1="21.5" x2="21.5" y2="2.5" />
    }
  }
</svg>
