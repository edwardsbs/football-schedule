<div class="shell" [attr.inert]="wipeSeconds() > 0 ? '' : null">
  <header class="topbar">
    <a class="brand" routerLink="/live">
      <span class="mark">🏈</span> Kickoff
    </a>
    <nav class="nav">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
        >{{ link.label }}</a>
      }
    </nav>
    <button
      type="button"
      class="wipe-btn"
      [class.active]="wipeSeconds() > 0"
      [attr.aria-label]="wipeSeconds() > 0
        ? 'Screen controls locked for cleaning, ' + wipeSeconds() + ' seconds remaining'
        : 'Lock screen controls for 10 seconds to clean the touchscreen'"
      (click)="startWipe()"
    >
      <span aria-hidden="true">▣</span>
      Wipe@if (wipeSeconds() > 0) {&nbsp;{{ wipeSeconds() }}}
    </button>
    <button type="button" class="my-games-btn" (click)="myGamesOpen.set(true)">
      <span class="ico">★◉</span> My Games
    </button>
  </header>

  <div class="content-wrap">
    <div class="content" #contentEl (scroll)="onScroll()">
      <router-outlet />
    </div>

    <div class="kiosk-scrollbar" [class.hidden]="!scrollable()">
      <button type="button" class="cap up" aria-label="Scroll up" (click)="nudge(-1)">
        <span class="tri up-ico"></span>
      </button>
      <div class="track" #trackEl (pointerdown)="onTrackPointerDown($event)">
        <div
          class="thumb"
          [style.height.px]="thumbHeightPx()"
          [style.transform]="'translateY(' + thumbTopPx() + 'px)'"
          (pointerdown)="onThumbPointerDown($event)"
          (pointermove)="onThumbPointerMove($event)"
          (pointerup)="onThumbPointerUp($event)"
          (pointercancel)="onThumbPointerUp($event)"
        ></div>
      </div>
      <button type="button" class="cap down" aria-label="Scroll down" (click)="nudge(1)">
        <span class="tri down-ico"></span>
      </button>
    </div>
  </div>
</div>

<app-my-games-modal
  [attr.inert]="wipeSeconds() > 0 ? '' : null"
  [open]="myGamesOpen()"
  (closed)="myGamesOpen.set(false)"
/>
<app-game-detail-modal [attr.inert]="wipeSeconds() > 0 ? '' : null" />

@if (wipeSeconds() > 0) {
  <div
    class="wipe-shield"
    role="status"
    aria-live="assertive"
    aria-atomic="true"
    (contextmenu)="$event.preventDefault()"
  >
    <div class="wipe-status">
      <span class="wipe-status__label">Screen locked for cleaning</span>
      <strong class="wipe-status__count">{{ wipeSeconds() }}</strong>
      <span class="wipe-status__hint">Controls resume automatically</span>
    </div>
  </div>
}
