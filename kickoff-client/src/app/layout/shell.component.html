<div class="shell" [attr.inert]="wipeSeconds() > 0 ? '' : null">
  <header class="topbar">
    <a class="brand" routerLink="/live">
      <span class="mark">🏈</span> Kickoff
    </a>
    <div class="nav-strip">
      @if (navCanScrollLeft()) {
        <button type="button" class="nav-scroll-btn left" aria-label="Show earlier tabs" (click)="scrollNav(-1)">
          <span class="nav-chevron left" aria-hidden="true"></span>
        </button>
      }
      <nav class="nav" #navEl (scroll)="onNavScroll()">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            [class.active]="isLinkActive(link)"
            [class.starts-group]="link.startsGroup"
            [attr.aria-current]="isLinkActive(link) ? 'page' : null"
            [attr.aria-label]="link.logoOnly ? link.label : null"
          >
            @if (link.leagueLogo) {
              <img
                class="league-nav-logo"
                [class.ncaa]="link.leagueSection === 'ncaa'"
                [class.nfl]="link.leagueSection === 'nfl'"
                [src]="link.leagueLogo"
                alt=""
                aria-hidden="true"
              />
            }
            @if (!link.logoOnly) { {{ link.label }} }
          </a>
        }
      </nav>
      @if (navCanScrollRight()) {
        <button type="button" class="nav-scroll-btn right" aria-label="Show later tabs" (click)="scrollNav(1)">
          <span class="nav-chevron right" aria-hidden="true"></span>
        </button>
      }
    </div>
    <button
      type="button"
      class="wipe-btn"
      [class.active]="wipeSeconds() > 0"
      [attr.aria-label]="wipeSeconds() > 0
        ? 'Screen controls locked for cleaning, ' + wipeSeconds() + ' seconds remaining'
        : 'Lock screen controls for 10 seconds to clean the touchscreen'"
      (click)="startWipe()"
    >
      <span aria-hidden="true">▣</span>
      Wipe@if (wipeSeconds() > 0) {&nbsp;{{ wipeSeconds() }}}
    </button>
    <button
      type="button"
      class="demo-btn"
      [class.active]="demo.enabled()"
      [attr.aria-pressed]="demo.enabled()"
      [attr.aria-label]="demo.enabled() ? 'Stop mock game simulator' : 'Start mock game simulator'"
      [attr.title]="demo.enabled()
        ? 'Mock NFL + NCAA games running · tap to stop'
        : 'Run mock NFL + NCAA games'"
      (click)="demo.toggle()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="3" />
        <path d="M6 12h3l1.5-3.5 3 7 1.5-3.5h3" />
      </svg>
      @if (demo.enabled()) { <span class="demo-live-dot"></span> }
    </button>
    <button type="button" class="my-games-btn" (click)="myGamesOpen.set(true)">
      <span class="ico">★◉</span> My Games
    </button>
  </header>

  <div class="content-wrap">
    <div class="content" #contentEl (scroll)="onScroll()">
      <router-outlet />
    </div>

    <div class="kiosk-scrollbar" [class.hidden]="!scrollable()">
      <button type="button" class="cap up" aria-label="Scroll up" (click)="nudge(-1)">
        <span class="tri up-ico"></span>
      </button>
      <div class="track" #trackEl (pointerdown)="onTrackPointerDown($event)">
        <div
          class="thumb"
          [style.height.px]="thumbHeightPx()"
          [style.transform]="'translateY(' + thumbTopPx() + 'px)'"
          (pointerdown)="onThumbPointerDown($event)"
          (pointermove)="onThumbPointerMove($event)"
          (pointerup)="onThumbPointerUp($event)"
          (pointercancel)="onThumbPointerUp($event)"
        ></div>
      </div>
      <button type="button" class="cap down" aria-label="Scroll down" (click)="nudge(1)">
        <span class="tri down-ico"></span>
      </button>
    </div>
  </div>
</div>

<app-my-games-modal
  [attr.inert]="wipeSeconds() > 0 ? '' : null"
  [open]="myGamesOpen()"
  (closed)="myGamesOpen.set(false)"
/>
<app-game-detail-modal [attr.inert]="wipeSeconds() > 0 ? '' : null" />

@if (wipeSeconds() > 0) {
  <div
    class="wipe-shield"
    role="status"
    aria-live="assertive"
    aria-atomic="true"
    (contextmenu)="$event.preventDefault()"
  >
    <div class="wipe-status">
      <span class="wipe-status__label">Screen locked for cleaning</span>
      <strong class="wipe-status__count">{{ wipeSeconds() }}</strong>
      <span class="wipe-status__hint">Controls resume automatically</span>
    </div>
  </div>
}
