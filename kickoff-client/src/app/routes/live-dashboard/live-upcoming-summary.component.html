<section class="summary">
  <div>
    <span class="kicker">Upcoming</span>
    <h2>{{ today() ? 'Games later today' : 'Next scheduled slate' }}</h2>
    <p>{{ game().kickoffUtc | date: 'EEEE, MMMM d' }}</p>
  </div>

  @if (countdown(); as value) {
    <div class="countdown" aria-label="Time until the next kickoff">
      <span>Next kickoff in</span>
      <strong>{{ value }}</strong>
      <small>
        <span
          class="team-highlight"
          [class.favorite-team]="fan.isFavorite(game().away.id)"
          [class.ranked-team]="game().away.currentRank !== null"
        >
          {{ game().away.abbreviation }}
        </span>
        at
        <span
          class="team-highlight"
          [class.favorite-team]="fan.isFavorite(game().home.id)"
          [class.ranked-team]="game().home.currentRank !== null"
        >
          {{ game().home.abbreviation }}
        </span>
        ·
        {{ game().kickoffUtc | date: 'h:mm a' }}
      </small>
    </div>
  }
</section>
